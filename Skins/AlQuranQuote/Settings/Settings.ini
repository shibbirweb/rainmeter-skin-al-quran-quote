; Custom verse text. The typed value goes into a variable first (not passed as a Lua argument) so an
; apostrophe in the text cannot break the command; commitCustomText() then reads and applies it.
[MeasureCustomTextInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
X=#Col2X#
Y=(#CustomTextBaseY# + #LabelH#)
W=#ContentW#
H=#InputH#
FontFace=#SettingsFont#
FontSize=#SettingsFontSize#
FontColor=#SettingsTextColor#
SolidColor=#SettingsInputBg#
FocusDismiss=1
DefaultValue=#WorkCustomText#
Command1=[!SetVariable WorkCustomText "$UserInput$"][!CommandMeasure MeasureSettingsScript "commitCustomText()"]

; Manual sura (chapter) number. Nullable: submit an empty field to clear it.
[MeasureSuraInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
X=#Col2X#
Y=(#SuraNumberBaseY# + #LabelH#)
W=#ContentW#
H=#InputH#
FontFace=#SettingsFont#
FontSize=#SettingsFontSize#
FontColor=#SettingsTextColor#
SolidColor=#SettingsInputBg#
InputNumber=1
FocusDismiss=1
DefaultValue=#WorkSuraNumber#
Command1=[!SetVariable WorkSuraNumber "$UserInput$"][!CommandMeasure MeasureSettingsScript "commitSuraNumber()"]

; Manual verse (ayah) number. Nullable: submit an empty field to clear it.
[MeasureVerseInput]
