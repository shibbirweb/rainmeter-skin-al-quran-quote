FontSize=#SettingsFontSize#
FontColor=#SettingsTextColor#
SolidColor=#SettingsInputBg#
FocusDismiss=1
DefaultValue=#BgColorR#,#BgColorG#,#BgColorB#
Command1=[!CommandMeasure MeasureSettingsScript "setBackgroundColorManual('$UserInput$')"]

