; Tab bar (Text / Panel / Verse). Each tab's meters are in a Tab group; setTab shows one, hides the rest.
; ---------------------------------------------------------------------------

[MeterTabText]
Meter=String
DynamicVariables=1
X=(#Tab1X# + #TabW# / 2)
Y=(#TabBarY# + (#TabH# - #SettingsFontSize#) / 2)
