; Al-Quran Quote - Settings panel.
; A child config toggled from the settings icon on the main skin. It reads the current values from the
; parent config's Variables.inc (seeded into working variables by Settings.lua), lets the user change them
; with a font list, color sliders and an opacity range, and applies each change to the main skin without
; refreshing this panel. The panel's own look comes from SettingsTheme.inc, kept separate from the skin's
; tunables, so editing the skin never changes how this panel looks.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Draggable=1

[Metadata]
Name=Al-Quran Quote Settings
Author=MD. Shibbir Ahmed
Information=Settings panel for the Al-Quran Quote skin: font family, size, style, colors, border and background opacity, panel size, rotation, and reference label. | Author: https://shibbirweb.github.io | Source: https://github.com/shibbirweb/rainmeter-skin-al-quran-quote
; Version is the single source of truth in RMSKIN.ini; CI stamps it here at build time. Do not hand-edit.
Version=1.0.0
License=MIT

; This panel's own theme first, then the skin's live values (read only to seed the controls).
; Use CURRENTPATH (this subfolder), not #@#, because #@# points at the ROOT config's @Resources.
@IncludeVariables=#CURRENTPATH#@Resources\SettingsTheme.inc
@IncludeVariables2=#ROOTCONFIGPATH#@Resources\Variables.inc

; ---------------------------------------------------------------------------
; Measures
; ---------------------------------------------------------------------------

[MeasureSettingsScript]
Measure=Script
ScriptFile=#ROOTCONFIGPATH#@Resources\Scripts\Settings.lua
UpdateDivider=-1

[MeasureDurationInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
X=#Pad#
Y=(#DurationBaseY# + #LabelH#)
W=#ContentW#
H=#LabelH#
FontFace=#SettingsFont#
FontSize=#SettingsFontSize#
FontColor=#SettingsTextColor#
SolidColor=#SettingsInputBg#
InputNumber=1
FocusDismiss=1
DefaultValue=#WorkDuration#
Command1=[!CommandMeasure MeasureSettingsScript "setDuration('$UserInput$')"]

; Manual-entry inputs (alongside the list/sliders). Each opens over its row when its hint is clicked.
[MeasureFontManualInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
X=#Col2X#
Y=(#FamilyBaseY# + #LabelH# + #RowH#)
W=#ContentW#
H=#InputH#
FontFace=#SettingsFont#
FontSize=#SettingsFontSize#
FontColor=#SettingsTextColor#
SolidColor=#SettingsInputBg#
FocusDismiss=1
DefaultValue=#WorkFontFamily#
Command1=[!CommandMeasure MeasureSettingsScript "setFont('$UserInput$')"]

[MeasureBgColorInput]
Measure=Plugin
