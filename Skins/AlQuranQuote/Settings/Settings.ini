H=#TabH#
StringAlign=Center
FontFace=#SettingsFont#
FontSize=#SettingsFontSize#
FontColor=#Tab1Color#
AntiAlias=1
Text=Text
LeftMouseUpAction=[!CommandMeasure MeasureSettingsScript "setTab(1)"]
ToolTipText=Font and reference settings

