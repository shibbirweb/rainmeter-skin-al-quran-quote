[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Al-Quran Quote (window 6)
Author=MD. Shibbir Ahmed
Information=Additional Al-Quran Quote window. Shares the base skin's scripts, offline verses and reference label/custom text (base @Resources); keeps its own verse and styling in this folder. Activated from the base skin's settings (Panel tab, Quote windows). | Author: https://shibbirweb.github.io | Source: https://github.com/shibbirweb/rainmeter-skin-al-quran-quote | Verse data: https://quran.com
; Version is the single source of truth in RMSKIN.ini; CI stamps it here at build time. Do not hand-edit.
Version=1.0.0
License=MIT

; A clone window. Structure comes from the shared @Resources\Quote.inc (base skin), @Include'd below. This
; window's own styling (Variables.inc) and verse (LastVerse.inc) live in this folder's @Resources; the
; reference label and custom text (UserContent.inc) are shared from the base @Resources. The shared scripts
; resolve the base @Resources from #SKINSPATH# and this window's own folder from #CURRENTPATH#, so no custom
; path variables are needed here (a custom variable cannot nest a built-in like #SKINSPATH# in ScriptFile).
@IncludeVariables=#CURRENTPATH#@Resources\Variables.inc
@IncludeVariables2=#CURRENTPATH#@Resources\LastVerse.inc
@IncludeVariables3=#SKINSPATH#AlQuranQuote\@Resources\UserContent.inc

@Include=#SKINSPATH#AlQuranQuote\@Resources\Quote.inc
