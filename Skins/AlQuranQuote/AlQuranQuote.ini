[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Al-Quran Quote
Author=MD. Shibbir Ahmed
Information=A minimal desktop widget that shows a random verse from the Holy Quran (Saheeh International English translation) with its reference. Verses are fetched from the quran.com API v4 with an offline fallback, and rotate on a timer. Click the arrow by the reference for the next verse. | Author: https://shibbirweb.github.io | Source: https://github.com/shibbirweb/rainmeter-skin-al-quran-quote | Verse data: https://quran.com
; Version is the single source of truth in RMSKIN.ini; CI stamps it here at build time. Do not hand-edit.
Version=1.0.0
License=MIT

@IncludeVariables=#@#Variables.inc

; ---------------------------------------------------------------------------
; Measures
; ---------------------------------------------------------------------------

; Holds the Lua entry points Online() / Offline(). Loaded once; no timed updates of its own.
[MeasureRandom]
Measure=Script
ScriptFile=#@#Scripts\RandomAyah.lua
UpdateDivider=-1

; Downloads a random verse. quran.com verses/random returns a new verse on every real download.
; It downloads once on load, then only when told to via [!CommandMeasure MeasureQuran "Update"]:
; [MeasureRotateTick] fires that on rotation, and the next-verse control fires it on click. UpdateRate is
; set very high (see DownloadOnDemandRate) so the WebParser never downloads on its own timer; rotation is
; driven entirely by the tick and gated by AutoChange. This keeps rotation decoupled from the download:
; toggling rotation or changing the duration is a live variable change, not a refresh, so it never
; refetches the displayed verse.
; Do NOT set UpdateDivider=-1 to stop the auto-timer: CommandMeasure "Update" only resets the WebParser's
; internal counter, and the actual download runs on the measure's NEXT update. With UpdateDivider=-1 the
; measure never updates again, so "Update" (both rotation and the click) silently downloads nothing.
; Do NOT put DynamicVariables=1 on a WebParser parent: it re-reads the URL every cycle and the threaded
; download never settles to fire FinishAction.
[MeasureQuran]
Measure=Plugin
Plugin=WebParser
URL=https://api.quran.com/api/v4/verses/random?language=en&translations=20
; Force a direct connection. WebParser defaults to the system/IE proxy config, so on machines with proxy
; auto-detect (WPAD) enabled the download can hang forever with no FinishAction and no error (the skin
; stays on "Loading verse..."). The value must be /none (with the leading slash): WebParser maps /none to
; a direct connection and /auto to the system proxy; any other string (e.g. "None") is treated as a
; literal proxy hostname and still hangs. This bypasses the system proxy for every user, no Windows change.
ProxyServer=/none
RegExp=(?siU)"verse_key":"(.*)".*"text":"(.*)"
UpdateRate=#DownloadOnDemandRate#
FinishAction=[!CommandMeasure MeasureRandom "Online()"]
OnConnectErrorAction=[!CommandMeasure MeasureRandom "Offline()"]
OnDownloadErrorAction=[!CommandMeasure MeasureRandom "Offline()"]
OnRegExpErrorAction=[!CommandMeasure MeasureRandom "Offline()"]

; Rotation timer, decoupled from the download so toggling rotation or changing the duration never
; refetches the current verse. The skin updates once per second (Update=1000), so this Calc counts one
; per second and wraps back to 0 every RotateEvery seconds via the modulo. When it hits 0 and AutoChange
; is on, it forces MeasureQuran to download the next verse. RotateEvery and AutoChange are read with
; DynamicVariables=1, so changing the duration or toggling the checkbox takes effect immediately with no
; refresh. The first tick is 1 (not 0), so the first rotation happens after RotateEvery seconds, not on
; load. AutoChange gates the action instead of multiplying RotateEvery, so RotateEvery is never 0 (no
; divide-by-zero in the modulo).
[MeasureRotateTick]
Measure=Calc
Formula=(MeasureRotateTick + 1) % #RotateEvery#
DynamicVariables=1
IfCondition=(MeasureRotateTick = 0) && (#AutoChange# = 1)
; CommandMeasure "Update" resets the WebParser's counter; !UpdateMeasure then forces the measure to update
; this tick, which starts the download immediately instead of waiting for the next natural update.
IfTrueAction=[!CommandMeasure MeasureQuran "Update"][!UpdateMeasure MeasureQuran]

[MeasureKey]
Measure=Plugin
Plugin=WebParser
URL=[MeasureQuran]
StringIndex=1

[MeasureEnglish]
Measure=Plugin
Plugin=WebParser
URL=[MeasureQuran]
StringIndex=2
RegExpSubstitute=1
Substitute="<[^>]*>":""

; ---------------------------------------------------------------------------
; Meters
; ---------------------------------------------------------------------------

; Semi-transparent panel. Height is auto (grows to fit the verse) unless the user set a fixed height:
; HeightAuto is 0 or 1, so the arithmetic below selects one branch (no ternary). The auto branch reserves a
; top band for the settings icon (Pad + icon height + gap) plus a bottom Pad. Clicking the panel does NOT
; change the verse; use the next-verse control by the reference. The panel stays draggable.
[MeterPanel]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,#PanelWidth#,(#HeightAuto# * (#Pad# + #GearIconHeight# + #IconGap# + [MeterQuote:H] + 8 + [MeterReference:H] + #Pad#) + (1 - #HeightAuto#) * #FixedHeight#),#Radius# | Fill Color #PanelColorRGB#,#PanelOpacity# | StrokeWidth 1 | Stroke Color #PanelBorderRGB#,#PanelBorderOpacity#

[MeterQuote]
Meter=String
DynamicVariables=1
X=(#PanelWidth# / 2)
Y=(#Pad# + #GearIconHeight# + #IconGap#)
W=(#PanelWidth# - #Pad# * 2)
StringAlign=Center
FontFace=#QuoteFont#
FontSize=#QuoteSize#
FontColor=#QuoteColor#
StringStyle=#QuoteStyle#
ClipString=2
AntiAlias=1
Text=#QuoteText#

; Reference line, composed from the editable label and the verse key so the label updates live.
[MeterReference]
Meter=String
DynamicVariables=1
X=(#PanelWidth# / 2)
Y=8R
W=(#PanelWidth# - #Pad# * 2)
StringAlign=Center
FontFace=#RefFont#
FontSize=#RefSize#
FontColor=#RefColor#
AntiAlias=1
Text=#ReferenceLabel# #VerseKey#

; Small next-verse control on the reference line (right side): fetches the next verse when clicked.
; A near-transparent rectangle gives the whole icon a clickable hit area; the arrow is a ">" chevron
; drawn with two lines (vector, no font or image).
[MeterNextVerse]
Meter=Shape
DynamicVariables=1
X=(#PanelWidth# - #Pad# - #NextIconWidth#)
Y=[MeterReference:Y]
Shape=Rectangle 0,0,#NextIconWidth#,#NextIconHeight# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line 3,3,(#NextIconWidth# - 3),(#NextIconHeight# / 2) | StrokeWidth 2 | Stroke Color #GearColor#
Shape3=Line (#NextIconWidth# - 3),(#NextIconHeight# / 2),3,(#NextIconHeight# - 3) | StrokeWidth 2 | Stroke Color #GearColor#
LeftMouseUpAction=[!CommandMeasure MeasureQuran "Update"][!UpdateMeasure MeasureQuran]
ToolTipText=Next verse

; Small "sliders" icon in the top-right corner; opens/closes the settings panel (a child config).
; Drawn as vector shapes (three lines with knobs) so it renders regardless of file encoding.
[MeterSettingsGear]
Meter=Shape
DynamicVariables=1
Hidden=#SettingsIconHidden#
X=(#PanelWidth# - #Pad# - #GearIconWidth#)
Y=#Pad#
Shape=Line 0,3,#GearIconWidth#,3 | StrokeWidth 2 | Stroke Color #GearColor#
Shape2=Line 0,7,#GearIconWidth#,7 | StrokeWidth 2 | Stroke Color #GearColor#
Shape3=Line 0,11,#GearIconWidth#,11 | StrokeWidth 2 | Stroke Color #GearColor#
Shape4=Ellipse 4,3,2.6 | Fill Color #GearColor#
Shape5=Ellipse 10,7,2.6 | Fill Color #GearColor#
Shape6=Ellipse 5,11,2.6 | Fill Color #GearColor#
LeftMouseUpAction=[!ToggleConfig "AlQuranQuote\Settings" "Settings.ini"]
ToolTipText=Settings
