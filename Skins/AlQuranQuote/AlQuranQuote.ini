[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Al-Quran Quote
Author=MD. Shibbir Ahmed
Information=A minimal desktop widget that shows a verse from the Holy Quran (Saheeh International English translation) with its reference. Verses come from a bundled offline verses list, or optionally from the quran.com API v4, and rotate on a timer. Click the arrow by the reference for the next verse. | Author: https://shibbirweb.github.io | Source: https://github.com/shibbirweb/rainmeter-skin-al-quran-quote | Verse data: https://quran.com
; Version is the single source of truth in RMSKIN.ini; CI stamps it here at build time. Do not hand-edit.
Version=1.0.0
License=MIT

; This is window 1. Its structure (measures + meters) lives in the shared @Resources\Quote.inc, @Include'd
; below and reused by every clone window (Windows\Wn). Each window keeps its OWN state (its own verse and
; styling) in its own @Resources; the shared scripts + quotes.txt live here and are reached by every window
; via the #SKINSPATH# built-in (see Quote.inc / RandomAyah.lua), while each window persists its verse to its
; own @Resources via #CURRENTPATH# (see Verse.lua).
@IncludeVariables=#@#Variables.inc
; LastVerse.inc holds the persisted last verse; included second so its saved values win on restart.
@IncludeVariables2=#@#LastVerse.inc
; UserContent.inc (UTF-16) holds the user-typed ReferenceLabel and CustomText so Unicode persists.
@IncludeVariables3=#@#UserContent.inc

@Include=#@#Quote.inc
