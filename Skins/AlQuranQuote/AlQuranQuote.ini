[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Al-Quran Quote
Author=MD. Shibbir Ahmed
Information=A minimal desktop widget that shows a random verse from the Holy Quran (Saheeh International English translation) with its reference. Verses are fetched from the quran.com API v4 with an offline fallback, and rotate on a timer. Left-click for the next verse. | Source: https://github.com/shibbirweb/rainmeter-skin-al-quran-quote | Verse data: https://quran.com
; Version is the single source of truth in RMSKIN.ini; CI stamps it here at build time. Do not hand-edit.
Version=1.0.0
License=MIT

@IncludeVariables=#@#Variables.inc

; ---------------------------------------------------------------------------
; Measures
; ---------------------------------------------------------------------------

; Holds the Lua entry points Online() / Offline(). Loaded once; no timed updates of its own.
[MeasureRandom]
Measure=Script
ScriptFile=#@#Scripts\RandomAyah.lua
UpdateDivider=-1

; Downloads a random verse. quran.com verses/random returns a new verse on every real download.
; [MeasureRotateTick] forces a re-download on the rotation timer; clicking the panel forces one too.
; Do NOT put DynamicVariables=1 on a WebParser parent: it re-reads the URL every cycle and the threaded
; download never settles to fire FinishAction.
[MeasureQuran]
Measure=Plugin
Plugin=WebParser
URL=https://api.quran.com/api/v4/verses/random?language=en&translations=20
RegExp=(?siU)"verse_key":"(.*)".*"text":"(.*)"
; Download once on load (UpdateDivider=-1 = update only once, never on the WebParser's own timer). Rotation
; is driven by [MeasureRotateTick] forcing an Update; clicking the panel also forces one. This keeps
; rotation decoupled from the download timer, so toggling AutoChange never refetches the current verse.
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureRandom "Online()"]
OnConnectErrorAction=[!CommandMeasure MeasureRandom "Offline()"]
OnRegExpErrorAction=[!CommandMeasure MeasureRandom "Offline()"]

; Rotation timer: counts skin updates (one per second) and forces a new verse every RotateEvery seconds
; while AutoChange is 1. Reads both variables dynamically, so changing the duration or toggling rotation
; takes effect immediately without a refresh (and without refetching the current verse).
[MeasureRotateTick]
Measure=Calc
DynamicVariables=1
Formula=((MeasureRotateTick + 1) % #RotateEvery#)
IfCondition=((MeasureRotateTick = 0) && (#AutoChange# = 1))
IfTrueAction=[!CommandMeasure MeasureQuran "Update"]

[MeasureKey]
Measure=Plugin
Plugin=WebParser
URL=[MeasureQuran]
StringIndex=1

[MeasureEnglish]
Measure=Plugin
Plugin=WebParser
URL=[MeasureQuran]
StringIndex=2
RegExpSubstitute=1
Substitute="<[^>]*>":""

; ---------------------------------------------------------------------------
; Meters
; ---------------------------------------------------------------------------

; Semi-transparent panel; also the click target. Height is auto (grows to fit the verse) unless the user
; set a fixed height: HeightAuto is 0 or 1, so the arithmetic below selects one branch (no ternary).
; The auto branch reserves a top band for the settings icon (Pad + icon height + gap) plus a bottom Pad.
[MeterPanel]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,#PanelWidth#,(#HeightAuto# * (#Pad# + #GearIconHeight# + #IconGap# + [MeterQuote:H] + 8 + [MeterReference:H] + #Pad#) + (1 - #HeightAuto#) * #FixedHeight#),#Radius# | Fill Color #PanelColorRGB#,#PanelOpacity# | StrokeWidth 1 | Stroke Color #PanelBorder#
LeftMouseUpAction=[!CommandMeasure MeasureQuran "Update"]
ToolTipText=Click for the next verse

[MeterQuote]
Meter=String
DynamicVariables=1
X=(#PanelWidth# / 2)
Y=(#Pad# + #GearIconHeight# + #IconGap#)
W=(#PanelWidth# - #Pad# * 2)
StringAlign=Center
FontFace=#QuoteFont#
FontSize=#QuoteSize#
FontColor=#QuoteColor#
StringStyle=#QuoteStyle#
ClipString=2
AntiAlias=1
Text=#QuoteText#

[MeterReference]
Meter=String
DynamicVariables=1
X=(#PanelWidth# / 2)
Y=8R
W=(#PanelWidth# - #Pad# * 2)
StringAlign=Center
FontFace=#RefFont#
FontSize=#RefSize#
FontColor=#RefColor#
AntiAlias=1
Text=#RefText#

; Small "sliders" icon in the top-right corner; opens/closes the settings panel (a child config).
; Drawn as vector shapes (three lines with knobs) so it renders regardless of file encoding.
[MeterSettingsGear]
Meter=Shape
DynamicVariables=1
X=(#PanelWidth# - #Pad# - #GearIconWidth#)
Y=#Pad#
Shape=Line 0,3,#GearIconWidth#,3 | StrokeWidth 2 | Stroke Color #GearColor#
Shape2=Line 0,7,#GearIconWidth#,7 | StrokeWidth 2 | Stroke Color #GearColor#
Shape3=Line 0,11,#GearIconWidth#,11 | StrokeWidth 2 | Stroke Color #GearColor#
Shape4=Ellipse 4,3,2.6 | Fill Color #GearColor#
Shape5=Ellipse 10,7,2.6 | Fill Color #GearColor#
Shape6=Ellipse 5,11,2.6 | Fill Color #GearColor#
LeftMouseUpAction=[!ToggleConfig "AlQuranQuote\Settings" "Settings.ini"]
ToolTipText=Settings
