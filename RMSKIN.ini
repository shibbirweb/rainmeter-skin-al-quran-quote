; Packaging metadata for the Rainmeter Skin Packager (builds the distributable .rmskin installer).
; Keep Name/Author/Version in sync with [Metadata] in AlQuranQuote\AlQuranQuote.ini.
[rmskin]
Name=Al-Quran Quote
Author=MD. Shibbir Ahmed
Version=1.0.0

; Load this skin automatically after install.
LoadType=Skin
LoadName=AlQuranQuote\AlQuranQuote.ini

; Preserve the user's edited settings on upgrade (do not overwrite these files). The base window's
; Variables.inc plus each pooled clone window's own Variables.inc, so per-window styling survives upgrades.
VariableFiles=AlQuranQuote\@Resources\Variables.inc | AlQuranQuote\Windows\W2\@Resources\Variables.inc | AlQuranQuote\Windows\W3\@Resources\Variables.inc | AlQuranQuote\Windows\W4\@Resources\Variables.inc | AlQuranQuote\Windows\W5\@Resources\Variables.inc | AlQuranQuote\Windows\W6\@Resources\Variables.inc | AlQuranQuote\Windows\W7\@Resources\Variables.inc | AlQuranQuote\Windows\W8\@Resources\Variables.inc

; Minimum environment required to install.
MinimumRainmeter=4.5.0
MinimumWindows=6.1
